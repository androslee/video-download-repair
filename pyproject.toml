[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-repair-lab"
version = "0.1.1"
description = "Local video fragment alignment with an independent Blender timeline adapter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
video-repair = "video_repair_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
