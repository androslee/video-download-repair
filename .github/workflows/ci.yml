name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Linux engine and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install engine and test dependencies
        run: python -m pip install -e . pytest build
      - name: Check tracked files for common private and generated content
        run: python scripts/check_repository.py
      - name: Test engine and shuffler
        run: python -m pytest -q
      - name: Build Python distributions
        run: python -m build
      - name: Test installed wheel outside source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m video_repair_lab --help

  blender:
    name: Linux Blender Python adapter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
      - name: Install test runtime
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Verify real Blender API tests run
        run: |
          python -c "import bpy; print('Blender', bpy.app.version_string)"
          python -m pytest -q tests/test_blender.py
      - name: Build add-on package
        run: python scripts/package_addon.py
